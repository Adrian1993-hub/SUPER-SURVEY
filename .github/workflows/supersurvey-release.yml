name: SuperSurvey Release (packaged installers)

# Builds platform installers and attaches them to a (draft) GitHub Release:
#   - Windows : .msi (WiX) + .exe (NSIS)
#   - macOS   : .dmg + .app
#   - Linux   : .AppImage + .deb
# via tauri-action. Trigger by pushing a version tag (e.g. v0.1.0) or manually.
#
# Code signing is OFF unless the secrets below are set (safe to leave unset; you
# get unsigned bundles). See docs/packaging.md. This is CI config — validate it
# on the first real run; it cannot be executed in the dev sandbox.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux bundling deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo + tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: ${{ matrix.platform }}-tauri-${{ hashFiles('ui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-tauri-

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Build + package (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing / notarization / updater (set as repo
          #     secrets to enable; unset = unsigned bundles) -----------------
          # macOS signing + notarization:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing (if you enable the updater plugin):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: "SuperSurvey ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
