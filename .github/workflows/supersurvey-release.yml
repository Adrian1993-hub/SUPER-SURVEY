name: SuperSurvey Release (packaged installers)

# Builds platform installers and attaches them to a (draft) GitHub Release:
#   - Windows : .msi (WiX) + .exe (NSIS)
#   - macOS   : .dmg + .app
#   - Linux   : .AppImage + .deb
# via tauri-action. Trigger by pushing a version tag (e.g. v0.1.0) or manually.
#
# Code signing is OFF unless the secrets below are set (safe to leave unset; you
# get unsigned bundles). See docs/packaging.md. This is CI config — validate it
# on the first real run; it cannot be executed in the dev sandbox.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux bundling deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo + tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: ${{ matrix.platform }}-tauri-${{ hashFiles('ui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-tauri-

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      # Updater: si el secret TAURI_SIGNING_PRIVATE_KEY existe, se firman los
      # artefactos y se genera latest.json (createUpdaterArtifacts se inyecta por
      # --config para que el build siga funcionando SIN el secret).
      - name: Detect updater signing key
        id: upd
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
          else
            echo 'args=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build + package (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma del UPDATER (activa solo si el secret existe — docs/actualizaciones.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Firma/notarización APPLE: OFF por defecto (pasar secrets VACÍOS rompe
          # `security import`). Para activar, añadir secrets y descomentar —
          # ver docs/packaging.md §3.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ui
          args: ${{ steps.upd.outputs.args }}
          # Tag-push uses the pushed tag; manual dispatch uses the `version` input
          # so tauri-action creates that tag + release (the CI token can; the dev
          # sandbox cannot push tags).
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "SuperSurvey ${{ github.event.inputs.version || github.ref_name }}"
          releaseDraft: true
          prerelease: false
