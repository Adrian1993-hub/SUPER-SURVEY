# ============================================================================
# SuperSurvey — Branding (WHITE-LABEL: única fuente de verdad)
# ----------------------------------------------------------------------------
# Este archivo es el ÚNICO lugar donde vive la identidad pública del producto.
# Para cambiar de marca (p. ej. para un comprador/licenciatario) edita los
# valores de aquí y recompila — NO hay que tocar código, UI ni plantillas.
#
#   "SuperSurvey" es solo el NOMBRE CLAVE INTERNO (repo, crate, docs de dev).
#   El NOMBRE PÚBLICO que se ve en la app, los reportes y los PDF sale de
#   [product].name.
#
# Capas (complementarias, no se contradicen):
#   - brand.toml ............. identidad de fábrica horneada en un build.
#   - SQLite app_settings + inspectors.signature_image_path
#                            . overrides en tiempo de ejecución por
#                              instalación (empresa, logo, firmas), editables
#                              dentro de la app.
#   Ningún otro archivo puede hardcodear estos valores.
# ============================================================================

[product]
name            = "SuperSurvey"   # nombre público. Para renombrar: p. ej. "YOLO.EXE" — cambia SOLO esta línea
short_name      = "SuperSurvey"
executable_name = "supersurvey"   # base del instalador/.exe -> p. ej. "yolo"
tagline         = "Survey calculation, comparison & signable reports"

[company]
name          = ""                # empresa licenciataria/dueña (vacío = build sin marca)
contact_email = ""
website       = ""

[theme]
# NOTA (fase de diseño, jul-2026): el sistema de temas vive en la app como
# matriz de tokens OKLCH (3 estéticas × claro/oscuro) en ui/src/index.css;
# estos hex quedan como identidad de fábrica para materiales de marca.
# El override de colores en runtime es brand.json (ver docs/packaging.md §5).
primary_color   = "#0B5FFF"
secondary_color = "#0A2540"
accent_color    = "#00B37E"

[logo]
# Rutas relativas a /branding. Coloca los assets reales en branding/assets/.
app_light = "assets/logo-light.svg"
app_dark  = "assets/logo-dark.svg"
report    = "assets/logo-report.png"

[reports]
header_title = "SuperSurvey"      # impreso en el encabezado de cada reporte
footer_text  = "Generated by SuperSurvey"
show_logo    = true
pdf_author   = "SuperSurvey"
pdf_creator  = "SuperSurvey"
