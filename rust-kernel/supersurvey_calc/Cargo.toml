[package]
name = "supersurvey_calc"
version = "0.1.1"
edition = "2021"
description = "SuperSurvey calculation kernel - Sprint 1C movement and paired measurement aggregation kernel"
license = "UNLICENSED"

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
