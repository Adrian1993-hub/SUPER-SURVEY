[package]
name = "supersurvey_license"
version = "0.1.1"
edition = "2021"
description = "Licencias SuperSurvey: payload firmado Ed25519 (verificación en la app; emisión solo en el keygen)"
license = "UNLICENSED"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# La EMISIÓN (firma) solo la necesita el keygen del dueño; la app únicamente
# verifica. Separarlo por feature evita arrastrar RNG al binario distribuido.
[features]
issuer = ["ed25519-dalek/rand_core", "dep:rand"]

[dependencies.rand]
version = "0.8"
optional = true
