<!doctype html>
<html lang="es" data-theme="control-room" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperSurvey</title>
    <script>
      // Aplica tema + modo guardados antes de pintar (evita flash). Migración de
      // instalaciones previas a la matriz: sin 'ss-mode' guardado, ocean era la
      // única piel clara → ocean hereda light, el resto dark.
      try {
        var r = document.documentElement
        var t = localStorage.getItem('ss-theme') || 'control-room'
        var m = localStorage.getItem('ss-mode') || (t === 'ocean' ? 'light' : 'dark')
        r.setAttribute('data-theme', t)
        r.setAttribute('data-mode', m === 'light' ? 'light' : 'dark')
        r.setAttribute('data-font', localStorage.getItem('ss-font') || 'geist')
        r.setAttribute('data-density', localStorage.getItem('ss-density') || 'comfortable')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'control-room')
        document.documentElement.setAttribute('data-mode', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
